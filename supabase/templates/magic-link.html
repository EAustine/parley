<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
  </head>
  <body style="margin:0; padding:0; background-color:#f7f8f9;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
           style="background-color:#f7f8f9; padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                 style="max-width:480px; background-color:#ffffff; border:1px solid #e3e6ea;
                        border-radius:8px; padding:32px;">
            <tr>
              <td style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
                         font-size:20px; line-height:26px; font-weight:600; letter-spacing:-0.02em;
                         color:#16181d; padding-bottom:24px;">
                Parley
              </td>
            </tr>
            <tr>
              <td style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
                         font-size:15px; line-height:22px; color:#16181d; padding-bottom:24px;">
                Sign in to Parley with the button below. It expires in an hour and works once.
              </td>
            </tr>
            <tr>
              <td style="padding-bottom:24px;">
                <a href="{{ .ConfirmationURL }}"
                   style="display:inline-block; background-color:#16181d; color:#ffffff;
                          font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
                          font-size:15px; line-height:22px; font-weight:600; text-decoration:none;
                          padding:13px 24px; border-radius:8px;">
                  Sign in
                </a>
              </td>
            </tr>
            <tr>
              <td style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
                         font-size:13px; line-height:18px; color:#5c636e; padding-bottom:8px;">
                If the button does not work, paste this into your browser:
              </td>
            </tr>
            <tr>
              <td style="font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
                         font-size:13px; line-height:18px; color:#5c636e; word-break:break-all;
                         padding-bottom:24px;">
                {{ .ConfirmationURL }}
              </td>
            </tr>
            <tr>
              <td style="border-top:1px solid #e3e6ea; padding-top:24px;
                         font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
                         font-size:13px; line-height:18px; color:#5c636e;">
                You asked for this link from Parley. If it wasn't you, ignore this email — nobody
                can sign in without opening it.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
